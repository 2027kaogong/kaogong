<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4A90D9">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="考公工作台">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="apple-touch-startup-image" href="icons/icon-512.svg">
  <meta name="mobile-web-app-capable" content="yes">
  <title>考公工作台</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 顶部栏 -->
  <header id="app-header">
    <div class="header-left">
      <button id="back-btn" class="header-btn hide" onclick="window.router.back()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <h1 id="page-title">考公工作台</h1>
    </div>
    <div class="header-right">
      <button class="header-btn" onclick="App.toggleDarkMode()" id="dark-mode-toggle" title="切换暗色模式">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
      </button>
    </div>
  </header>

  <!-- 主内容区域 -->
  <main id="app-content">
    <!-- 页面由 JS 动态渲染 -->
  </main>

  <!-- 底部导航 -->
  <nav id="bottom-nav">
    <button class="nav-item active" data-page="home" onclick="App.navigate('home')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="nav-label">首页</span>
    </button>
    <button class="nav-item" data-page="plan" onclick="App.navigate('plan')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span class="nav-label">计划</span>
    </button>
    <button class="nav-item" data-page="practice" onclick="App.navigate('practice')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 015.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span class="nav-label">刷题</span>
    </button>
    <button class="nav-item" data-page="error-book" onclick="App.navigate('error-book')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <span class="nav-label">错题</span>
    </button>
    <button class="nav-item" data-page="morning" onclick="App.navigate('morning')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      <span class="nav-label">晨读</span>
    </button>
    <button class="nav-item" data-page="statistics" onclick="App.navigate('statistics')">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/><line x1="2" y1="20" x2="22" y2="20"/></svg>
      <span class="nav-label">统计</span>
    </button>
  </nav>

  <!-- 弹窗容器 -->
  <div id="modal-overlay" class="modal-overlay hide" onclick="App.closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()" id="modal-body"></div>
  </div>

  <!-- Toast 通知 -->
  <div id="toast-container"></div>

  <script src="js/utils.js"></script>
  <script src="js/idioms-data.js"></script>
  <script src="js/sample-questions.js"></script>
  <script src="js/web-cache.js"></script>
  <script src="js/morning-data.js"></script>
  <script src="js/db.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/practice.js"></script>
  <script src="js/pages/error-book.js"></script>
  <script src="js/pages/plan.js"></script>
  <script src="js/pages/morning.js"></script>
  <script src="js/pages/statistics.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
